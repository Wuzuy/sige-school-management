<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - SIGE</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="icon" href="assets/images/sige.png" type="image/png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <style>
        .recovery-container {
            max-width: 450px;
            margin: 80px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .recovery-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .recovery-header h1 {
            color: #003366;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .recovery-header p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #003366;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #003366 0%, #0066cc 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 51, 102, 0.3);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #003366;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="recovery-container">
        <div class="recovery-header">
            <h1>🔐 Recuperar Senha</h1>
            <p>Digite seu email cadastrado e enviaremos um link para redefinir sua senha.</p>
        </div>

        <div id="messageBox"></div>

        <form id="recovery-form">
            <div class="form-group">
                <label for="recovery-email">Email</label>
                <input 
                    type="email" 
                    id="recovery-email" 
                    name="email" 
                    placeholder="seu@email.com"
                    required>
            </div>
            <button type="submit" class="btn-submit" id="btn-submit">Enviar Link de Recuperação</button>
        </form>

        <div class="back-link">
            <a href="login.html">← Voltar ao Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/api-config.js"></script>
<script src="assets/js/scripts.js"></script>
    <script>
        document.getElementById('recovery-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('recovery-email').value.trim();
            const messageBox = document.getElementById('messageBox');
            const button = document.getElementById('btn-submit');
            
            if (!isValidEmail(email)) {
                showError('Por favor, insira um email válido.');
                return;
            }

            button.disabled = true;
            button.innerHTML = '<span class="loading"></span> Enviando...';

            try {
                await request('/usuarios/recuperar-senha', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                showSuccess('Email de recuperação enviado com sucesso! Verifique sua caixa de entrada.');
                setTimeout(() => window.location.href = 'login.html', 3000);
            } catch (error) {
                showError(`Erro ao enviar recuperação: ${error.message}`);
                button.disabled = false;
                button.innerHTML = 'Enviar Link de Recuperação';
            }
        });
    </script>
</body>
</html>
