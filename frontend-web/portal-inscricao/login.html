<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGE - Acesso</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="icon" href="assets/images/sige.png" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
</head>
<body data-page="login">
  <header class="insc-header">
    <div class="insc-header-inner">
      <div class="insc-brand">
        <img src="assets/images/sige.png" alt="SIGE" />
        <span>Sistema de Inscrição e Gestão</span>
      </div>
      <nav class="insc-nav">
        <button class="insc-nav-link" id="btn-acessibilidade" title="Acessibilidade">&#9881;</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Acesso ao SIGE</h1>
      <p>Plataforma unificada para alunos e secretaria.</p>
    </section>

    <section class="grid">
      <article class="card card-6">
        <h2>Entrar ou Criar Conta</h2>
        <div class="auth-switch">
          <button id="switch-login" class="active" type="button">Login</button>
          <button id="switch-register" type="button">Cadastro</button>
        </div>

        <form id="form-login">
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" required />
          </div>
          <div class="field">
            <label for="login-senha">Senha</label>
            <input id="login-senha" type="password" required />
          </div>
          <div style="text-align: right; margin-top: -8px; margin-bottom: 12px;">
            <a href="forgot-password.html" style="font-size: 13px; color: #003366; text-decoration: none;">Esqueci minha senha</a>
          </div>
          <button class="btn btn-primary" type="submit">Entrar</button>
        </form>

        <form id="form-register" class="hidden">
          <div class="field">
            <label for="register-nome">Nome completo</label>
            <input id="register-nome" type="text" required />
          </div>
          <div class="field">
            <label for="register-email">Email</label>
            <input id="register-email" type="email" required />
          </div>
          <div class="field">
            <label for="register-senha">Senha</label>
            <input id="register-senha" type="password" required />
          </div>
          <div class="field">
            <label for="register-confirmar">Confirmar senha</label>
            <input id="register-confirmar" type="password" required />
          </div>
          <button class="btn btn-primary" type="submit">Cadastrar</button>
        </form>
      </article>

      <article class="card card-6">
        <h2>Editais Publicados</h2>
        <p class="muted" style="margin-bottom: 12px;">Confira os editais ativos para processos seletivos:</p>
        <div id="editais-list" class="actions"></div>
      </article>

      <div class="card">
        <a href="credits.html"><h2>Créditos</h2></a>
      </div>
    </section>
  </main>

  <div class="acessibilidade-popup" id="acessibilidade-popup">
    <div class="acessibilidade-header">
      <strong>Acessibilidade</strong>
      <button id="acessibilidade-fechar">&times;</button>
    </div>
    <div class="acessibilidade-body">
      <div class="acessibilidade-item">
        <span class="acessibilidade-label">
          <span id="acessibilidade-icone-tema">&#127769;</span> Modo Noturno
        </span>
        <label class="acessibilidade-switch">
          <input type="checkbox" id="toggle-dark-mode">
          <span class="acessibilidade-slider"></span>
        </label>
      </div>
      <div class="acessibilidade-item">
        <span class="acessibilidade-label">&#128207; Tamanho da Fonte</span>
        <div class="acessibilidade-font">
          <button class="btn btn-sm" data-font="sm">A-</button>
          <button class="btn btn-sm btn-primary active" data-font="md">A</button>
          <button class="btn btn-sm" data-font="lg">A+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="acessibilidade-overlay" id="acessibilidade-overlay"></div>

  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="assets/js/api-config.js"></script>
  <script src="assets/js/scripts.js"></script>
</body>
</html>
