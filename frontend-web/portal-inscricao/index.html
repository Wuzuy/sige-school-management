<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGE - Cursos Disponíveis</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="icon" href="assets/images/sige.png" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
</head>
<body data-page="home">
  <header class="insc-header">
    <div class="insc-header-inner">
      <a href="index.html" class="insc-brand">
        <img src="assets/images/sige.png" alt="SIGE" />
        <span>SIGE</span>
      </a>
      <nav class="insc-nav">
        <a href="index.html" class="insc-nav-link">Cursos</a>
        <a href="status.html" class="insc-nav-link">Status</a>
        <a href="../portal-escolar/portal-aluno.html" class="insc-nav-link" data-student-only>Portal do Aluno</a>
        <a href="../portal-secretaria/portal-secretaria.html" class="insc-nav-link" data-admin-only>Secretaria</a>
        <button class="insc-nav-link" id="btn-acessibilidade" title="Acessibilidade">&#9881;</button>
        <button class="insc-nav-link insc-nav-logout" data-logout>Sair</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Cursos Disponíveis</h1>
      <p>Selecione um curso para realizar sua inscrição</p>
    </section>

    <section class="grid">
      <article class="card" style="grid-column: span 12;">
        <h2>Cursos</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Unidade</th>
                <th>Curso</th>
                <th>Turno</th>
                <th>Data Início</th>
                <th>Duração</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody id="courses-body"></tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <div class="acessibilidade-popup" id="acessibilidade-popup">
    <div class="acessibilidade-header">
      <strong>Acessibilidade</strong>
      <button id="acessibilidade-fechar">&times;</button>
    </div>
    <div class="acessibilidade-body">
      <div class="acessibilidade-item">
        <span class="acessibilidade-label">
          <span id="acessibilidade-icone-tema">&#127769;</span> Modo Noturno
        </span>
        <label class="acessibilidade-switch">
          <input type="checkbox" id="toggle-dark-mode">
          <span class="acessibilidade-slider"></span>
        </label>
      </div>
      <div class="acessibilidade-item">
        <span class="acessibilidade-label">&#128207; Tamanho da Fonte</span>
        <div class="acessibilidade-font">
          <button class="btn btn-sm" data-font="sm">A-</button>
          <button class="btn btn-sm btn-primary active" data-font="md">A</button>
          <button class="btn btn-sm" data-font="lg">A+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="acessibilidade-overlay" id="acessibilidade-overlay"></div>

  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="assets/js/api-config.js"></script>
  <script src="assets/js/scripts.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const auth = requireAuth();
      if (auth) {
        initHomePage();
      }
    });
  </script>
</body>
</html>
