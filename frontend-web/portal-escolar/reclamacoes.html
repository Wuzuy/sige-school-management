<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGE - Reclamações e Ouvidoria</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="icon" href="assets/images/sige.png" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
</head>
<body data-page="reclamacoes">
  <header class="topbar">
    <div class="brand">
      <img src="assets/images/sige.png" alt="SIGE" />
      <span>SIGE</span>
    </div>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
      <span>☰</span>
    </button>
  </header>
  <div class="nav-overlay"></div>
  <aside id="sidebar">
    <nav id="sidebar-nav"></nav>
  </aside>
  <section class="hero interface">
    <div class="containerCardR" id="reclamacoes-summary">
      <div class="cardR" style="border-left: 5px solid #f59e0b;">
        <div>
          <h1>Pendentes:</h1>
          <h1 id="count-pendente">0</h1>
        </div>
        <p>Aguardando análise</p>
      </div>
      <div class="cardR" style="border-left: 5px solid #3b82f6;">
        <div>
          <h1>Em Andamento:</h1>
          <h1 id="count-andamento">0</h1>
        </div>
        <p>Sendo processadas</p>
      </div>
      <div class="cardR" style="border-left: 5px solid #10b981;">
        <div>
          <h1>Resolvidas:</h1>
          <h1 id="count-resolvida">0</h1>
        </div>
        <p>Finalizadas</p>
      </div>
    </div>
    <div style="margin-top: 24px;">
      <h2 style="font-size: 1.2rem; margin-bottom: 16px; color: #1e293b;">Minhas Reclamações</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Protocolo</th>
              <th>Data</th>
              <th>Categoria</th>
              <th>Assunto</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="reclamacoes-table">
            <tr><td colspan="6" class="muted" style="text-align:center; padding:20px;">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="assets/js/api-config.js"></script>
  <script src="assets/js/scripts.js"></script>
  <script src="assets/js/sidebar-nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = requireAuth();
      if (!auth) return;
      setupProtectedPage(auth);
      setupMobileMenu();

      try {
        const reclamacoes = await request('/aluno/reclamacoes');
        const body = document.getElementById('reclamacoes-table');

        if (!reclamacoes || reclamacoes.length === 0) {
          body.innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center; padding:20px;">Nenhuma reclamação encontrada.</td></tr>';
          document.getElementById('count-pendente').textContent = '0';
          document.getElementById('count-andamento').textContent = '0';
          document.getElementById('count-resolvida').textContent = '0';
          return;
        }

        let pendentes = 0, andamento = 0, resolvidas = 0;
        reclamacoes.forEach(r => {
          if (r.status === 'PENDENTE') pendentes++;
          else if (r.status === 'EM_ANDAMENTO') andamento++;
          else if (r.status === 'RESOLVIDO' || r.status === 'RESOLVIDA') resolvidas++;
        });

        document.getElementById('count-pendente').textContent = pendentes;
        document.getElementById('count-andamento').textContent = andamento;
        document.getElementById('count-resolvida').textContent = resolvidas;

        const statusLabels = { PENDENTE: 'Pendente', EM_ANDAMENTO: 'Em Andamento', RESOLVIDO: 'Resolvido', RESOLVIDA: 'Resolvido' };
        const statusColors = { PENDENTE: '#fef3c7; color:#b45309', EM_ANDAMENTO: '#dbeafe; color:#1e40af', RESOLVIDO: '#d1fae5; color:#047857', RESOLVIDA: '#d1fae5; color:#047857' };

        body.innerHTML = reclamacoes.map(r => `
          <tr>
            <td>${r.protocolo || '-'}</td>
            <td>${r.data_abertura ? new Date(r.data_abertura).toLocaleDateString('pt-BR') : '-'}</td>
            <td>${r.categoria || '-'}</td>
            <td>${r.assunto || '-'}</td>
            <td><span class="status" style="background: ${statusColors[r.status] || '#f1f5f9; color:#475569'}">${statusLabels[r.status] || r.status || 'Pendente'}</span></td>
            <td><a href="detalhes-reclamacao.html?id=${r.id}" class="btn btn-soft btn-sm">Ver Detalhes</a></td>
          </tr>
        `).join('');
      } catch (e) {
        document.getElementById('reclamacoes-table').innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center; padding:20px; color:#dc2626;">Erro ao carregar reclamações.</td></tr>';
        showError('Erro ao carregar reclamações');
      }
    });
  </script>
</body>
</html>
