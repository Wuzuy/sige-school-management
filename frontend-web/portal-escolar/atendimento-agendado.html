<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGE - Atendimento Agendado</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="icon" href="assets/images/sige.png" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
  <style>
    .containerAA { display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; }
    @media (max-width: 900px) { .containerAA { grid-template-columns: 1fr; } }
    .containerAAG { background: white; border-radius: 12px; padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .containerAAG h2 { margin: 0 0 4px; color: #1e293b; }
    .containerAAG .proximo-status { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
    .containerIAAG { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .containerIAAG div { background: #f8fafc; padding: 12px; border-radius: 8px; }
    .containerIAAG p { margin: 0; }
    .containerIAAG p:first-child { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; font-weight: 600; }
    .containerIAAG p:last-child { font-size: 1rem; font-weight: 500; color: #1e293b; }
    .containerBAAG { display: flex; gap: 8px; }
    .containerBAAG button { flex: 1; }
    .containerCardsAA h1 { font-size: 1.1rem; margin-bottom: 16px; color: #1e293b; }
    .cardAA { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
    .cardAA > div:first-child { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .cardAA > div:first-child p { margin: 0; }
    .cardAA > div:first-child p:first-child { font-weight: 600; color: #1e293b; }
    .cardAA > div:first-child p:last-child { color: var(--muted); font-size: 0.85rem; }
    .cardAA > div:last-child { display: flex; gap: 8px; flex-wrap: wrap; }
    .cardAA > div:last-child p { margin: 0; font-size: 0.85rem; color: var(--muted); }
    .badge-status { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .badge-agendado { background: #dbeafe; color: #1e40af; }
    .badge-concluido { background: #d1fae5; color: #047857; }
    .badge-cancelado { background: #fee2e2; color: #b91c1c; }
    .contadorReunioes { display: flex; gap: 12px; margin-top: 16px; }
    .reuniao { flex: 1; text-align: center; background: #f8fafc; padding: 12px; border-radius: 8px; }
    .reuniao h1 { font-size: 1.5rem; margin: 0; color: var(--primary); }
    .reuniao p { font-size: 0.85rem; margin: 4px 0 0; color: var(--muted); }
    .empty-state { text-align: center; padding: 40px; color: var(--muted); }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-page="atendimento-agendado">
  <header class="topbar">
    <div class="brand">
      <img src="assets/images/sige.png" alt="SIGE" />
      <span>Portal Escolar - SIGE</span>
    </div>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
      <span>☰</span>
    </button>
  </header>
  <div class="nav-overlay"></div>
  <aside id="sidebar">
    <nav id="sidebar-nav"></nav>
  </aside>
  <section class="hero interface">
    <h1 style="margin-bottom: 8px; color: #1e293b;">Atendimento Agendado</h1>
    <p style="margin-bottom: 24px; color: var(--muted);">Acompanhe e solicite seus agendamentos</p>

    <div style="margin-bottom: 20px;">
      <button class="btn btn-primary" id="btn-solicitar-atendimento" type="button">
        <i class="fas fa-calendar-plus"></i> Solicitar Atendimento
      </button>
    </div>

    <div id="form-solicitar-atendimento" style="display:none; background: white; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow); border: 1px solid var(--border);">
      <h2 style="margin: 0 0 16px; color: #1e293b;">Solicitar Novo Atendimento</h2>
      <form id="atendimento-form">
        <div class="field">
          <label for="tipo-atendimento">Tipo de Atendimento <span class="required">*</span></label>
          <select id="tipo-atendimento" required>
            <option value="">Selecione</option>
            <option value="Orientacao Academica">Orientação Acadêmica</option>
            <option value="Documentacao">Documentação</option>
            <option value="Suporte Financeiro">Suporte Financeiro</option>
            <option value="Suporte Tecnico">Suporte Técnico</option>
            <option value="Matricula">Matrícula</option>
          </select>
        </div>
        <div class="field">
          <label for="data-atendimento">Data <span class="required">*</span></label>
          <input type="date" id="data-atendimento" required min="">
        </div>
        <div class="field">
          <label for="hora-atendimento">Horário <span class="required">*</span></label>
          <input type="time" id="hora-atendimento" required>
        </div>
        <div class="field">
          <label for="obs-atendimento">Observações</label>
          <textarea id="obs-atendimento" rows="3" placeholder="Informações adicionais..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-enviar-atendimento">Solicitar</button>
        <button type="button" class="btn btn-soft" id="btn-cancelar-atendimento">Cancelar</button>
      </form>
    </div>

    <div class="containerAA" id="atendimento-container">
      <p id="loading-atendimentos" style="color: var(--muted);">Carregando agendamentos...</p>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="assets/js/api-config.js"></script>
  <script src="assets/js/scripts.js"></script>
  <script src="assets/js/sidebar-nav.js"></script>
  <script>
    async function carregarAtendimentos() {
      try {
        const atendimentos = await request('/aluno/atendimentos');
        const container = document.getElementById('atendimento-container');

        if (!atendimentos || atendimentos.length === 0) {
          container.innerHTML = '<div class="empty-state"><p style="font-size:1.2rem;margin-bottom:8px;">Nenhum atendimento agendado</p><p>Clique em "Solicitar Atendimento" para agendar.</p></div>';
          return;
        }

        const proximo = atendimentos.find(a => a.status === 'AGENDADO' || a.status === 'PENDENTE');
        const hoje = new Date().toISOString().slice(0, 10);
        const hojeAtendimentos = atendimentos.filter(a => a.data_atendimento === hoje && a.status !== 'CANCELADO');
        const totalHoje = hojeAtendimentos.length;
        const totalSemana = atendimentos.filter(a => a.status !== 'CANCELADO').length;

        let html = '';

        if (proximo) {
          html += `
            <div class="containerAAG">
              <h2>${proximo.id_responsavel?.nome_completo || 'Atendimento'}</h2>
              <p class="proximo-status">Próximo atendimento &bull; ${proximo.status === 'AGENDADO' ? 'Confirmado' : 'Pendente'}</p>
              <div class="containerIAAG">
                <div>
                  <p>Tipo</p>
                  <p>${proximo.tipo || 'Atendimento'}</p>
                </div>
                <div>
                  <p>Data</p>
                  <p>${proximo.data_atendimento ? new Date(proximo.data_atendimento + 'T12:00:00').toLocaleDateString('pt-BR') : '-'}</p>
                </div>
                <div>
                  <p>Horário</p>
                  <p>${proximo.hora ? proximo.hora.slice(0, 5) : '-'}</p>
                </div>
                <div>
                  <p>Responsável</p>
                  <p>${proximo.id_responsavel?.nome_completo || 'A definir'}</p>
                </div>
              </div>
              ${proximo.observacoes ? `<p style="background:#f8fafc;padding:12px;border-radius:8px;margin-bottom:16px;color:#475569;">${proximo.observacoes}</p>` : ''}
            </div>
          `;
        } else {
          html += `
            <div class="containerAAG">
              <div class="empty-state">
                <p style="font-size:1.1rem;margin-bottom:8px;">Nenhum próximo atendimento</p>
                <p>Todos os atendimentos foram concluídos ou cancelados.</p>
              </div>
            </div>
          `;
        }

        html += `
          <div class="containerCardsAA">
            <h1>Todos os Agendamentos</h1>
            ${atendimentos.filter(a => a.status !== 'CANCELADO').length === 0 ? '<p style="color:var(--muted);">Nenhum agendamento ativo.</p>' :
            atendimentos.map(a => `
              <div class="cardAA">
                <div>
                  <p><strong>${a.id_responsavel?.nome_completo || 'Atendimento'}</strong></p>
                  <p>${a.data_atendimento ? new Date(a.data_atendimento + 'T12:00:00').toLocaleDateString('pt-BR') : '-'}</p>
                </div>
                <div>
                  <span class="badge-status badge-${a.status === 'AGENDADO' ? 'agendado' : a.status === 'CONCLUIDO' ? 'concluido' : 'cancelado'}">${a.status === 'AGENDADO' ? 'Agendado' : a.status === 'CONCLUIDO' ? 'Concluído' : 'Cancelado'}</span>
                  <p>${a.tipo || ''} ${a.hora ? 'às ' + a.hora.slice(0, 5) : ''}</p>
                </div>
              </div>
            `).join('')}
            <div class="contadorReunioes">
              <div class="reuniao">
                <h1>${totalHoje}</h1>
                <p>Hoje</p>
              </div>
              <div class="reuniao">
                <h1>${totalSemana}</h1>
                <p>Total</p>
              </div>
            </div>
          </div>
        `;

        container.innerHTML = html;
      } catch (e) {
        document.getElementById('atendimento-container').innerHTML = '<div class="empty-state"><p style="color:#dc2626;">Erro ao carregar agendamentos.</p></div>';
        showError('Erro ao carregar atendimentos');
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = requireAuth();
      if (!auth) return;
      setupProtectedPage(auth);
      setupMobileMenu();

      carregarAtendimentos();

      document.getElementById('data-atendimento').min = new Date().toISOString().slice(0, 10);

      document.getElementById('btn-solicitar-atendimento').addEventListener('click', () => {
        const form = document.getElementById('form-solicitar-atendimento');
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
      });

      document.getElementById('btn-cancelar-atendimento').addEventListener('click', () => {
        document.getElementById('form-solicitar-atendimento').style.display = 'none';
        document.getElementById('atendimento-form').reset();
      });

      document.getElementById('atendimento-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-enviar-atendimento');
        btn.disabled = true;
        btn.textContent = 'Solicitando...';

        try {
          const tipo = document.getElementById('tipo-atendimento').value;
          const data_atendimento = document.getElementById('data-atendimento').value;
          const hora = document.getElementById('hora-atendimento').value;
          const observacoes = document.getElementById('obs-atendimento').value.trim() || null;

          if (!tipo || !data_atendimento || !hora) {
            showWarning('Preencha todos os campos obrigatórios.');
            btn.disabled = false;
            btn.textContent = 'Solicitar';
            return;
          }

          await request('/aluno/atendimentos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tipo, data_atendimento, hora, observacoes })
          });

          showSuccess('Atendimento solicitado com sucesso!');
          document.getElementById('atendimento-form').reset();
          document.getElementById('form-solicitar-atendimento').style.display = 'none';
          carregarAtendimentos();
        } catch (e) {
          showError('Erro ao solicitar atendimento. Tente novamente.');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Solicitar';
        }
      });
    });
  </script>
</body>
</html>
