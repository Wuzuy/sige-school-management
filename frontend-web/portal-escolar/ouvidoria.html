<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGE - Apelação</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="icon" href="assets/images/sige.png" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-page="ouvidoria">
  <header class="topbar">
    <div class="brand">
      <img src="assets/images/sige.png" alt="SIGE" />
      <span>Portal Escolar - SIGE</span>
    </div>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
      <span>☰</span>
    </button>
  </header>
  <div class="nav-overlay"></div>
  <aside id="sidebar">
    <nav id="sidebar-nav"></nav>
  </aside>
  <section class="hero interface">
    <div style="max-width: 800px; margin: 0 auto;">
      <div style="background: white; border-radius: 12px; padding: 32px; box-shadow: var(--shadow); border: 1px solid var(--border);">
        <div style="text-align: center; margin-bottom: 24px;">
          <i class="fas fa-gavel" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 12px;"></i>
          <h1 style="margin: 0 0 8px; color: #1e293b;">Apelação</h1>
          <p style="color: var(--muted); margin: 0;">Recorra de uma reclamação que você considera não ter sido resolvida adequadamente.</p>
        </div>

        <form id="apelacao-form">
          <div class="field">
            <label for="protocolo-apelacao">Protocolo da Reclamação Original <span class="required">*</span></label>
            <input type="text" id="protocolo-apelacao" placeholder="Ex: PROT-2026-0000123" required>
            <small class="fieldHint">Informe o protocolo da reclamação que deseja recorrer.</small>
          </div>

          <div class="field">
            <label for="assunto-apelacao">Assunto <span class="required">*</span></label>
            <input type="text" id="assunto-apelacao" placeholder="Resumo da apelação" required>
          </div>

          <div class="field">
            <label for="motivo-apelacao">Motivo da Apelação <span class="required">*</span></label>
            <textarea id="motivo-apelacao" rows="6" placeholder="Explique detalhadamente por que você considera que a reclamação não foi resolvida adequadamente..." required></textarea>
            <small class="fieldHint">Descreva os pontos que não foram atendidos na resolução anterior.</small>
          </div>

          <button type="submit" class="btn btn-primary" id="btn-enviar-apelacao">Registrar Apelação</button>
        </form>
      </div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="assets/js/api-config.js"></script>
  <script src="assets/js/scripts.js"></script>
  <script src="assets/js/sidebar-nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = requireAuth();
      if (!auth) return;
      setupProtectedPage(auth);
      setupMobileMenu();

      document.getElementById('apelacao-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-enviar-apelacao');
        btn.disabled = true;
        btn.textContent = 'Enviando...';

        try {
          const protocolo = document.getElementById('protocolo-apelacao').value.trim();
          const assunto = document.getElementById('assunto-apelacao').value.trim();
          const motivo = document.getElementById('motivo-apelacao').value.trim();

          if (!protocolo || !assunto || !motivo) {
            showWarning('Preencha todos os campos obrigatórios.');
            btn.disabled = false;
            btn.textContent = 'Registrar Apelação';
            return;
          }

          await request('/aluno/reclamacoes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              categoria: 'APELACAO',
              assunto: assunto,
              descricao: 'Protocolo original: ' + protocolo + '\n\nMotivo da apelação:\n' + motivo
            })
          });

          showSuccess('Apelação registrada com sucesso! Em breve analisaremos.');
          document.getElementById('apelacao-form').reset();
        } catch (e) {
          showError('Erro ao registrar apelação. Tente novamente.');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Registrar Apelação';
        }
      });
    });
  </script>
</body>
</html>
