<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGE - Histórico Escolar</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="icon" href="assets/images/sige.png" type="image/png" />
</head>
<body data-page="historico">
  <header class="topbar">
      <div class="brand">
        <img src="assets/images/sige.png" alt="SIGE" />
        <span>Histórico Escolar</span>
      </div>
      <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span>☰</span>
      </button>
      <nav class="nav">
        <a href="index.html">Dashboard</a>
        <a href="portal-aluno.html">Perfil</a>
        <a href="historico-escolar.html">Histórico</a>
        <button data-logout type="button">Sair</button>
      </nav>
  </header>
  <div class="nav-overlay"></div>

  <main class="container">
    <section class="hero">
      <h1>Histórico Escolar</h1>
      <p>Visualize seu histórico acadêmico</p>
    </section>

    <section class="grid">
      <article class="card" style="grid-column: span 12;">
        <h2>Disciplinas e Notas</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Disciplina</th>
                <th>Professor</th>
                <th>Nota Final</th>
                <th>Frequência</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="historico-body">
              <tr>
                <td colspan="5" style="text-align: center; padding: 40px;">Carregando histórico...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <script src="assets/js/api-config.js"></script>
  <script src="assets/js/scripts.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setupMobileMenu();
      const auth = requireAuth();
      if (auth) setupProtectedPage(auth);
    });
  </script>
</body>
</html>
