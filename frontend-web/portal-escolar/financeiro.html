<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGE - Financeiro</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="icon" href="assets/images/sige.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-page="financeiro">
  <header class="topbar">
      <div class="brand">
        <img src="assets/images/sige.png" alt="SIGE" />
        <span>Portal Escolar - SIGE</span>
      </div>
      <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span>☰</span>
      </button>
      <nav class="nav">
        <button data-logout type="button">🚪 Sair</button>
      </nav>
  </header>
  <div class="nav-overlay"></div>

  <aside id="sidebar">
    <nav id="sidebar-nav"></nav>
  </aside>

  <main class="container">
    <section class="hero">
      <h1>Financeiro</h1>
      <p>Consultar boletos, mensalidades e situação financeira</p>
    </section>

    <section class="grid">
      <article class="card" style="grid-column: span 12;">
        <h2>Resumo Financeiro</h2>
        <div class="table-wrapper" id="financeiro-content">
          <p style="text-align: center; color: #999; padding: 40px;">Carregando dados financeiros...</p>
        </div>
      </article>
    </section>
  </main>

  <script src="assets/js/api-config.js"></script>
  <script src="assets/js/scripts.js"></script>
  <script src="assets/js/sidebar-nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setupMobileMenu();
      const auth = requireAuth();
      if (auth) setupProtectedPage(auth);
    });
  </script>
</body>
</html>
