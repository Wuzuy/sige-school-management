<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGE - Agenda Escolar</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="icon" href="assets/images/sige.png" type="image/png" />
</head>
<body data-page="agenda">
  <header class="topbar" id="headerID">
    <div class="brand">
      <img src="assets/images/sige.png" alt="SIGE" />
      <span>Portal Escolar - SIGE</span>
    </div>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
      <span>☰</span>
    </button>
  </header>
  <div class="nav-overlay"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <nav id="sidebar-nav"></nav>
  </aside>

  <main class="container">
    <section class="hero">
      <h1>Agenda Escolar</h1>
      <p>Confira os eventos e atividades programadas</p>
    </section>

    <section class="grid">
      <article class="card" style="grid-column: span 12;">
        <h2>Próximos Eventos</h2>
        <div id="agenda-events" style="line-height: 1.8;">
          <p style="text-align: center; color: #999; padding: 40px;">Carregando agenda...</p>
        </div>
      </article>
    </section>
  </main>

  <script src="assets/js/api-config.js"></script>
  <script src="assets/js/scripts.js"></script>
  <script src="assets/js/sidebar-nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setupMobileMenu();
      const auth = requireAuth();
      if (auth) setupProtectedPage(auth);
    });
  </script>
</body>
</html>
