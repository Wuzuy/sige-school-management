<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGE - Portal Escolar</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="icon" href="assets/images/sige.png" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
</head>
<body>
	<!-- HEADER -->
	<header class="topbar" id="headerID">
		<div class="brand">
			<img src="assets/images/sige.png" alt="SIGE" />
			<span>SIGE</span>
		</div>
		<button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span>☰</span>
      </button>
		<nav class="nav">
			<a href="status.html">Status</a>
			<a href="../portal-secretaria/portal-secretaria.html" data-admin-only>Portal da Secretaria</a>
			<button data-logout type="button">Sair</button>
		</nav>
  	</header>
	<div class="nav-overlay"></div>
	<!-- SIDEBAR -->
	<aside id="sidebar">
		<nav id="sidebar-nav"></nav>
	</aside>
	<section class="hero interface">
		<div class="gridConta">
			<!-- SEÇÃO ESQUERDA: DADOS SENSÍVEIS -->
			<div class="contaDadosSensiveis">
				<h2>Dados Sensíveis</h2>

				<div class="dataField">
					<div class="dataInfo">
						<label>CPF</label>
						<p class="dataContent">123.456.789-10</p>
					</div>
					<button class="btn-edit" title="Editar CPF">✎</button>
				</div>

				<div class="dataField">
					<div class="dataInfo">
						<label>Matrícula</label>
						<p class="dataContent">202400001</p>
					</div>
					<button class="btn-edit" title="Editar Matrícula">✎</button>
				</div>

				<div class="dataField">
					<div class="dataInfo">
						<label>Data de Nascimento</label>
						<p class="dataContent">15 de Março de 1985</p>
					</div>
					<button class="btn-edit" title="Editar Data de Nascimento">✎</button>
				</div>

				<div class="dividerSenha"></div>

				<div class="dataField">
					<div class="dataInfo">
						<label>Senha</label>
						<p class="dataContent">••••••••</p>
					</div>
					<button class="btn-edit btn-password" title="Alterar Senha">Alterar</button>
				</div>

				<div class="dataField">
					<div class="dataInfo">
						<label>Autenticação de Dois Fatores</label>
						<p class="dataContent">Desativado</p>
					</div>
					<button class="btn-edit" title="Ativar Autenticação 2FA">✎</button>
				</div>
			</div>

			<!-- SEÇÃO DIREITA: PERFIL E INFORMAÇÕES GERAIS -->
			<div class="contaPerfil">
				<div class="profileCard">
					<figure class="profilePicture">
						<img src="assets/images/sige.png" alt="Foto de Perfil">
					</figure>
					<button class="btn btn-soft editProfilePic">Editar Foto de Perfil</button>
				</div>

				<div class="profileInfoCard">
					<h2>Informações Gerais</h2>

					<div class="infoRow">
						<label>Nome Completo</label>
						<p>Prof. Sarah Jenkins</p>
					</div>

					<div class="infoRow">
						<label>Email</label>
						<p>sarah.jenkins@highschool.edu</p>
					</div>

					<div class="infoRow">
						<label>Cargo / Ocupação</label>
						<p>Senior Mathematics Faculty</p>
					</div>

					<div class="infoRow">
						<label>Telefone</label>
						<p>+1 (555) 123-4567</p>
					</div>

					<div class="infoRow">
						<label>Status da Conta</label>
						<p class="statusVerified">✓ Conta Verificada</p>
					</div>
				</div>
			</div>
		</div>
	</section>
<script src="assets/js/scripts.js"></script>
<script src="assets/js/sidebar-nav.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    setupMobileMenu();
  });
</script>
</body>
