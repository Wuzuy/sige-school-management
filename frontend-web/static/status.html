<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGE - Status</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" href="imagens/sige.png" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
</head>
<body data-page="status">
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <img src="imagens/sige.png" alt="SIGE" />
        <span>SIGE</span>
      </div>
      <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span>☰</span>
      </button>
      <nav class="nav">
        <a href="index.html">Cursos</a>
        <a href="portal-aluno.html">Portal do Aluno</a>
        <a href="portal-secretaria.html" data-admin-only>Portal da Secretaria</a>
        <button data-logout type="button">Sair</button>
      </nav>
    </div>
  </header>
  <div class="nav-overlay"></div>

  <main class="container">
    <section class="hero">
      <h1>Status da Inscrição</h1>
      <p>Status atual: <span id="status-atual" class="status">Carregando...</span></p>
    </section>

    <section class="card">
      <h2>Histórico</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Curso</th>
              <th>Unidade</th>
              <th>Data</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="status-body">
            <tr><td colspan="5">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section id="etapas-card" class="card hidden">
      <h2>Etapas do Processo Seletivo</h2>
      <div id="timeline-etapas"></div>
    </section>

    <section id="curso-detalhes-card" class="card hidden">
      <h2>Detalhes do curso</h2>
      <p><strong>Curso:</strong> <span id="detalhe-curso-nome">-</span></p>
      <p><strong>Tipo:</strong> <span id="detalhe-curso-tipo">-</span></p>
      <p><strong>Turno:</strong> <span id="detalhe-curso-turno">-</span></p>
      <p><strong>Unidade:</strong> <span id="detalhe-curso-unidade">-</span></p>
      <p><strong>Data de início:</strong> <span id="detalhe-curso-inicio">-</span></p>
      <p><strong>Duração:</strong> <span id="detalhe-curso-duracao">-</span></p>
      <p><strong>Status:</strong> <span id="detalhe-curso-status">-</span></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="api-config.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
