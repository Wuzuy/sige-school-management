<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGE - Acesso</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" href="imagens/sige.png" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
</head>
<body data-page="login">
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <img src="imagens/sige.png" alt="SIGE" />
        <span>Sistema de Inscrição e Gestão</span>
      </div>
    </div>
  </header>
  <div class="nav-overlay"></div>

  <main class="container">
    <section class="hero">
      <h1>Acesso ao SIGE</h1>
      <p>Plataforma unificada para alunos e secretaria.</p>
    </section>

    <section class="grid">
      <article class="card card-6">
        <h2>Entrar ou Criar Conta</h2>
        <div class="auth-switch">
          <button id="switch-login" class="active" type="button">Login</button>
          <button id="switch-register" type="button">Cadastro</button>
        </div>

        <form id="form-login">
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" required />
          </div>
          <div class="field">
            <label for="login-senha">Senha</label>
            <input id="login-senha" type="password" required />
          </div>
          <div style="text-align: right; margin-top: -8px; margin-bottom: 12px;">
            <a href="forgot-password.html" style="font-size: 13px; color: #003366; text-decoration: none;">Esqueci minha senha</a>
          </div>
          <button class="btn btn-primary" type="submit">Entrar</button>
        </form>

        <form id="form-register" class="hidden">
          <div class="field">
            <label for="register-nome">Nome completo</label>
            <input id="register-nome" type="text" required />
          </div>
          <div class="field">
            <label for="register-email">Email</label>
            <input id="register-email" type="email" required />
          </div>
          <div class="field">
            <label for="register-senha">Senha</label>
            <input id="register-senha" type="password" required />
          </div>
          <div class="field">
            <label for="register-confirmar">Confirmar senha</label>
            <input id="register-confirmar" type="password" required />
          </div>
          <button class="btn btn-primary" type="submit">Cadastrar</button>
        </form>
      </article>

      <article class="card card-6">
        <h2>Editais Publicados</h2>
        <p class="muted" style="margin-bottom: 12px;">Confira os editais ativos para processos seletivos:</p>
        <div id="editais-list" class="actions"></div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="api-config.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
