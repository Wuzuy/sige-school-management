<!DOCTYPE html>
<head>
	<!-- -->
	<title>Firjan SENAI Sesi</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="geral.css">
	<link rel="stylesheet" href="styleInscricao.css">
    <link rel="shortcut icon" type="image/x-icon" href="https://firjan.com.br/data/files/63/87/D9/E1/AD4B59109D34F849D8284EA8/favicon.ico">
</head>
<body>
	<!-- HEADER -->
	<header>
		<img src="imagens\1.png">
	</header>
	<div class="interfaceInscricao">
		<div class="containerInscricao">
			<div class="headerInscricao">
				<img src="imagens\logo_firjan_senai.webp">
				<p> Dados Pessoais </p>
				<p> Curso: CURSOSELECIONADO </p>
				<p> Turno: TURNOSELECIONADO </p>
			</div>
			<div class="headerInscricao mini">
				<h3 data-label="dadosPessoais"> Preencha seus dados pessoais. </h3>
				<p> Todas as informações são obrigatorias para realizar sua inscrição </p>
			</div>
			<form class="containerInputInscricao">
				<div class="containerInputs">
					<div class="flexbox">
						<label>Nome Completo</label>
						<input type="text" class="escrever" placeholder="Nome Completo">
					</div>
				</div>
				<div class="containerInputs">
					<div class="flexbox">
						<label>RG</label>
						<input type="text" class="escrever" placeholder="00.000.000-0">
					</div>
				</div>
				<div class="containerInputs">
					<div class="flexbox">
						<label>CPF</label>
						<input type="text" class="escrever" placeholder="000.000.000-00">
					</div>
				</div>
				<div class="containerInputs">
					<div class="flexbox">
						<label>Melhor número de contato</label>
						<input type="text" class="escrever" placeholder="(00)00000-0000">
					</div>
				</div>
				<div class="containerInputs">
					<div class="flexbox">
						<label>Melhor email de contato</label>
						<input type="email" class="escrever" placeholder="seuemail@email.com">
					</div>
				</div>
				<div class="containerInputs">
					<div class="flexbox">
						<label>Escolaridade</label>
						<select class="escrever">
							<option>Placeholder</option>
							<option>Placeholder</option>
							<option>Placeholder</option>
						</select>
					</div>
				</div>
				<div class="containerInputs">
					<div class="flexbox">
						<label>Data de Nasicmento</label>
						<input type="date" class="escrever">
					</div>
				</div>
				<div class="containerInputs">
					<button class="botaoInscrever">
						Inscrever-se
					</button>
				</div>
			</form>
		</div>
	</div>
	<script src="scripts.js">
	</script>
</body>
