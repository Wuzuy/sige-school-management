<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEJA SENAI - Inscrição</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body data-page="inscricao">
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <img src="imagens/1.png" alt="SENAI" />
        <span>SEJA SENAI</span>
      </div>
      <nav class="nav">
        <a href="index.html">Cursos</a>
        <a href="status.html">Status</a>
        <a href="portal-aluno.html">Portal do Aluno</a>
        <a href="portal-secretaria.html" data-admin-only>Portal da Secretaria</a>
        <button data-logout type="button">Sair</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Finalizar Inscrição</h1>
      <p>Aluno: <strong data-user-name>Aluno</strong></p>
    </section>

    <section class="grid">
      <article class="card card-6">
        <h2>Curso selecionado</h2>
        <p><strong>Curso/Turno:</strong> <span id="curso-info">Selecione um curso na página inicial</span></p>
        <p><strong>Unidade:</strong> <span id="unidade-info">-</span></p>
        <div id="curso-detalhes" class="alert alert-info hidden" style="margin-top: 12px;"></div>
      </article>

      <article class="card card-6">
        <h2>Dados para inscrição</h2>
        <form id="form-inscricao">
          <div class="field">
            <label for="escolaridade">Escolaridade declarada</label>
            <select id="escolaridade" required>
              <option value="">Selecione</option>
              <option>Ensino Fundamental</option>
              <option>Ensino Médio</option>
              <option>Ensino Técnico</option>
              <option>Ensino Superior</option>
            </select>
          </div>
          <div class="field">
            <label for="id-unidade-manual">Unidade (texto)</label>
            <input id="id-unidade-manual" type="text" placeholder="Ex: SENAI Caxias" required />
          </div>
          <button class="btn btn-primary" type="submit">Enviar inscrição</button>
        </form>
      </article>
    </section>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
