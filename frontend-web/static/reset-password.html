<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - SIGE</title>
    <link rel="stylesheet" href="app.css">
    <link rel="icon" href="imagens/sige.png" type="image/png" />
    <style>
        .reset-container {
            max-width: 450px;
            margin: 80px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .reset-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .reset-header h1 {
            color: #003366;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .reset-header p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #003366;
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            line-height: 1.5;
        }

        .password-requirements ul {
            margin: 5px 0 0 0;
            padding-left: 20px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #003366 0%, #0066cc 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 51, 102, 0.3);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #003366;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .validating {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <h1>?? Redefinir Senha</h1>
            <p>Digite sua nova senha abaixo.</p>
        </div>

        <div id="messageBox"></div>

        <div id="validating" class="validating">
            <div class="loading" style="border-color: #003366; border-top-color: transparent; width: 40px; height: 40px;"></div>
            <p style="margin-top: 15px;">Validando token...</p>
        </div>

        <form id="resetPasswordForm" class="hidden">
            <div class="form-group">
                <label for="newPassword">Nova Senha</label>
                <input 
                    type="password" 
                    id="newPassword" 
                    name="newPassword" 
                    placeholder="Digite sua nova senha" 
                    required
                    minlength="8"
                >
                <div class="password-requirements">
                    Requisitos da senha:
                    <ul>
                        <li>Mínimo de 8 caracteres</li>
                        <li>Pelo menos uma letra maiúscula</li>
                        <li>Pelo menos uma letra minúscula</li>
                        <li>Pelo menos um número</li>
                        <li>Pelo menos um caractere especial (@$!%*?&)</li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Nova Senha</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    placeholder="Digite novamente a senha" 
                    required
                    minlength="8"
                >
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Redefinir Senha
            </button>
        </form>

        <div class="back-link">
            <a href="login.html">? Voltar para o Login</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';

        // Extrair token da URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const messageBox = document.getElementById('messageBox');
        const validatingDiv = document.getElementById('validating');
        const form = document.getElementById('resetPasswordForm');

        // Validar token ao carregar página
        async function validateToken() {
            if (!token) {
                showError('Token não fornecido. Use o link enviado por email.');
                validatingDiv.classList.add('hidden');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/password-recovery/validate-token?token=${token}`);
                const data = await response.json();

                validatingDiv.classList.add('hidden');

                if (data.valid) {
                    form.classList.remove('hidden');
                } else {
                    showError(data.error || 'Token inválido ou expirado. Solicite uma nova recuperação de senha.');
                }

            } catch (error) {
                console.error('Erro:', error);
                validatingDiv.classList.add('hidden');
                showError('Erro ao validar token. Verifique se o backend está rodando.');
            }
        }

        // Validar token ao carregar
        validateToken();

        // Validar força da senha
        function validatePassword(password) {
            const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            return regex.test(password);
        }

        // Enviar formulário
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');

            messageBox.innerHTML = '';

            // Validar senhas iguais
            if (newPassword !== confirmPassword) {
                showError('As senhas não coincidem!');
                return;
            }

            // Validar força da senha
            if (!validatePassword(newPassword)) {
                showError('A senha não atende aos requisitos de segurança.');
                return;
            }

            // Desabilitar botão e mostrar loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> Redefinindo...';

            try {
                const response = await fetch(`${API_URL}/password-recovery/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        token: token,
                        newPassword: newPassword 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    messageBox.innerHTML = `
                        <div class="message success">
                            ? ${data.message || 'Senha redefinida com sucesso!'}
                        </div>
                    `;
                    form.classList.add('hidden');
                    
                    // Redirecionar para login após 3 segundos
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);

                } else {
                    showError(data.error || 'Erro ao redefinir senha. Tente novamente.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Redefinir Senha';
                }

            } catch (error) {
                console.error('Erro:', error);
                showError('Erro de conexão com o servidor. Verifique se o backend está rodando.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Redefinir Senha';
            }
        });

        function showError(message) {
            messageBox.innerHTML = `
                <div class="message error">
                    ? ${message}
                </div>
            `;
        }
    </script>
</body>
</html>
