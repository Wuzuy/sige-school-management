<!DOCTYPE html>
<head>
	<!-- -->
	<title>Formulário</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="styleLogin.css">
</head>
<body>
	<!-- HEADER COM LOGO E TÍTULO -->
	<header class="interfaceTelaLogin">
		<img src="logo_firjan_senai.webp">
		<p>Sistema de Inscrição de Cursos</p>
	</header>
	<div class="interfaceTelaLogin">
		<div class="containerLoginEditais">
			<!-- CONTAINER DE LOGIN -->
				<div class="gridbox">
					<!-- CONTAINER DO TEXTO -->
					<div class="yapContainer">
						<p> Acesso ao Sistema </p>
						<p> Faça login ou cadastre-se para se increver nos cursos </p>
					</div>
					<!-- CONTAINER DOS BOTÕES TOGGLE -->
					<div class="buttonBox">
						<button class="botaoLogin">
							Login
						</button>
						<button class="botaoLogin">
							Cadastro
						</button>
					</div>
					<!-- CONTAINER INPUT -->
					<div class="flexbox">
						<label>Email</label>
						<input type="text" class="escrever" placeholder="seu@email.com">
					</div>
					<div class="flexbox">
						<label>Senha</label>
						<input type="text" class="escrever" placeholder="●●●●●●●">
					</div>
					<!-- BOTÃO PRINCIPAL -->
					<button class="botaoPrincipal">
						Cadastrar
					</button>
				</div>
			<!-- CONTAINER DOS EDITAIS -->
				<div class="gridbox editais">
					<!-- CONTAINER DO TEXTO -->
					<div class="yapContainer">
						<p> Editais </p>
						<p> Confira os editais disponíveis </p>
					</div>
					<!-- CONTAINER DOS EDITAIS -->
					<div class="editalContanier">
						<div class="editalConteudo">
							<p class="tituloEdital">Edital 001/2025</p>
							<p class="textoEdital">Cursos Técnicos - Vagas Abertas </p>
						</div>
						<div class="editalConteudo">
							<p class="tituloEdital">Edital 002/2025</p>
							<p class="textoEdital">Cursos Técnicos - Vagas Abertas </p>
						</div>
					</div>
					<!-- CONTAINER INPUT -->
				</div>
		</div>
	</div>
</body>
